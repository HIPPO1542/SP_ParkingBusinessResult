name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install verification dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PARKING_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
          "PARKING_API_DLL=$env:GITHUB_WORKSPACE/Backend/ParkingBusinessResult.Api/bin/Release/net10.0/ParkingBusinessResult.Api.dll" >> $env:GITHUB_ENV
      - name: Build Release
        run: dotnet build SP_ParkingBusinessResult.sln -c Release --nologo
      - name: Check architecture and migrations
        run: |
          $checks = @('test_architecture.py', 'test_sqlite_migration.py', 'test_soft_delete_migration.py', 'test_parking_visit_migration.py', 'test_booking_migration.py', 'test_development_parking_data.py', 'test_postman_collection.py')
          foreach ($check in $checks) {
            python "tests/$check"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Check calculations and atomic operations
        run: |
          dotnet run --project tests/RevenueMetrics.Checks -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Enterprise.Checks -c Release --no-build -- "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check authentication and CRUD
        run: ./tests/api_sqlite_checks.ps1
      - name: Check reports and ownership
        run: ./tests/seeded_parking_api_checks.ps1
      - name: Check booking import and queries
        run: ./tests/parking_booking_import_checks.ps1
      - name: Check runtime and Production isolation
        run: ./tests/runtime_checks.ps1
